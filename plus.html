<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Plus — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <div id="list" class="grid"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => AgriApp.t(k);
    document.getElementById("title").textContent = t("plus");
    document.getElementById("list").innerHTML = `
      <a class="card" href="meteo.html"><h3>${t("meteo")}</h3></a>
      <a class="card" href="zat.html"><h3>${t("zat")}</h3></a>
      <a class="card" href="techniques.html"><h3>${t("techniques")}</h3></a>
      <a class="card" href="saison.html"><h3>${t("saison")}</h3></a>
      <a class="card" href="communaute.html"><h3>${t("communaute")}</h3></a>
      <a class="card" href="contacts.html"><h3>${t("contacts")}</h3></a>
      <a class="card" href="favoris.html"><h3>${t("favoris")}</h3></a>
      <article class="card">
        <h3>${t("notifs")}</h3>
        <p>${t("notifExplique")}</p>
        <p id="notifEtat" class="note"></p>
        <p>
          <button class="btn" type="button" onclick="AgriApp.enableNotifs().then(majNotif)">${t("activerNotifs")}</button>
          <button class="btn ghost" type="button" onclick="AgriApp.disableNotifs(); majNotif()">${t("couperNotifs")}</button>
        </p>
      </article>
      <article class="card">
        <h3>${t("tonPseudo")}</h3>
        <p id="anonNow">${AgriApp.anonId()}</p>
        <p><button class="btn ghost" type="button" onclick="document.getElementById('anonNow').textContent = AgriApp.newAnonId()">${t("nouveauPseudo")}</button></p>
      </article>
      <button class="btn" onclick="AgriApp.installApp()">${t("installerApp")}</button>
      <button class="btn ghost" onclick="AgriApp.setShell('web')">${t("voirSite")}</button>
    `;
    window.majNotif = function () {
      const el = document.getElementById("notifEtat");
      if (!el) return;
      const ok = AgriApp.notifOn() && Notification.permission === "granted";
      el.textContent = ok ? t("notifActives") : t("notifOff");
    };
    majNotif();
  </script>
</body>
</html>
