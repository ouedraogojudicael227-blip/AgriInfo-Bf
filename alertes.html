<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alertes — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <p class="note" id="zoneNote"></p>
    <div id="now" class="grid"></div>
    <h3>Autres alertes</h3>
    <div id="all" class="grid cards-2"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => AgriApp.t(k);
    const month = new Date().getMonth();
    const zone = AgriApp.zone();
    document.getElementById("title").textContent = t("alertes");
    document.getElementById("zoneNote").textContent = t("taZone") + " : " + AGRI.zones[zone].nom;
    const current = AGRI.alertes.filter((a) => a.quand.includes(month) && a.zones.includes(zone));
    const others = AGRI.alertes.filter((a) => !current.includes(a));
    const card = (a, hot) => `<article class="card ${hot ? "alert" : ""}"><div class="tag">${hot ? t("ceMois") : a.zones.join(" · ")}</div><h3>${a.titre}</h3><p>${a.texte}</p></article>`;
    document.getElementById("now").innerHTML = current.length ? current.map((a) => card(a, true)).join("") : `<article class="card"><p>Pas d alerte listée pour ce mois dans ta zone.</p></article>`;
    document.getElementById("all").innerHTML = others.map((a) => card(a, false)).join("");
  </script>
</body>
</html>
