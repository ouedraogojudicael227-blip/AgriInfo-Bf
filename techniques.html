<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Techniques — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <div id="list" class="grid cards-2"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => AgriApp.t(k);
    document.getElementById("title").textContent = t("techniques");
    document.getElementById("list").innerHTML = AGRI.techniques.map((x) => `
      <article class="card" id="${x.id}">
        <div class="row">
          <div class="tag">${x.type}</div>
          <button class="fav" data-fav="${x.id}" onclick="AgriApp.toggleFav('${x.id}')">${AgriApp.isFav(x.id) ? "\u2605" : "\u2606"}</button>
        </div>
        <h3>${x.nom}</h3>
        <img class="fiche-img" src="${AgriApp.img(x.id)}" alt="${x.nom}" onerror="this.remove()" />
        <p>${x.resume}</p>
        <h4>${t("etapes")}</h4>
        <ul class="list">${x.etapes.map((s) => `<li>${s}</li>`).join("")}</ul>
        <p><strong>${t("utilePour")} :</strong> ${x.utile}</p>
      </article>`).join("");
  </script>
</body>
</html>
