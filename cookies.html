<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cookies — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <article class="card">
      <p id="texte"></p>
      <p>
        <button class="btn" onclick="AgriApp.acceptCookies()">Accepter</button>
        <button class="btn ghost" onclick="AgriApp.refuseCookies()">Refuser</button>
      </p>
    </article>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    document.getElementById("title").textContent = AgriApp.t("cookiesTitre");
    document.getElementById("texte").textContent = AgriApp.t("cookiesPage");
  </script>
</body>
</html>
