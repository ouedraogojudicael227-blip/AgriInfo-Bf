<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZAT — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <p class="note" id="note"></p>
    <article class="card">
      <h3>Comment ca marche (site du ministere)</h3>
      <p>Sur agriculture.bf : UAT (village), ZAT (commune), DPARAH (province), DRARAH (region), MAERAH (Ouaga). Pas d annuaire telephone de tous les ZAT.</p>
      <p><a class="btn" href="https://www.agriculture.bf/les-structures/" target="_blank" rel="noopener">Structures officielles</a></p>
    </article>
    <div id="ici"></div>
    <h3 id="allTitle"></h3>
    <div id="list" class="grid cards-2"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => AgriApp.t(k);
    const me = AgriApp.region();
    document.getElementById("title").textContent = t("zat");
    document.getElementById("note").textContent = t("zatNote");
    document.getElementById("allTitle").textContent = t("autresRegions");
    document.getElementById("ici").innerHTML = `<article class="card"><div class="tag">${t("tonService")}</div><h3>${me.nom} — ${me.ville}</h3><p>${me.service}</p><p><a class="btn" href="tel:${me.tel.replace(/\s/g,"")}">${me.tel}</a></p></article>`;
    document.getElementById("list").innerHTML = AGRI.regions.filter((r) => r.id !== me.id).map((r) => `<article class="card"><h3>${r.nom} — ${r.ville}</h3><p>${r.service}</p><p><a href="tel:${r.tel.replace(/\s/g,"")}">${r.tel}</a></p></article>`).join("");
  </script>
</body>
</html>
