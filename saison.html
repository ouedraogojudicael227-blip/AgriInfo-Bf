<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saison — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <div id="list" class="grid cards-3"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => AgriApp.t(k);
    document.getElementById("title").textContent = t("saison");
    const current = new Date().getMonth();
    document.getElementById("list").innerHTML = AGRI.mois.map((m, i) => `
      <article class="card">
        <div class="tag">${i === current ? t("ceMois") : m.phase}</div>
        <h3>${m.nom}</h3>
        <p>${m.tache}</p>
      </article>`).join("");
  </script>
</body>
</html>
