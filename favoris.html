<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favoris — AgriInfo BF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap section">
    <h2 id="title"></h2>
    <div id="list" class="grid cards-2"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML();
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => AgriApp.t(k);
    document.getElementById("title").textContent = t("favoris");
    const ids = JSON.parse(localStorage.getItem("agri-favs") || "[]");
    const items = [...AGRI.cultures, ...AGRI.techniques].filter((x) => ids.includes(x.id));
    document.getElementById("list").innerHTML = items.length
      ? items.map((x) => `<article class="card"><h3>${x.nom}</h3><p>${x.resume}</p></article>`).join("")
      : `<div class="card">${t("pasFav")}</div>`;
  </script>
</body>
</html>
